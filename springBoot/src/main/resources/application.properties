server.port=9080
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}&sslmode=require&channelBinding=require
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.application.name=internship_Management
jwt.secret=${JWT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
spring.mail.properties.mail.debug=true

# Niveau de log
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.internship=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.internship.management=DEBUG

# Configuration pour le déploiement
server.servlet.context-path=/api
# cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ONLY these properties - no tomcat specific ones
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=10MB

# Afficher les erreurs dans la console
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS}
