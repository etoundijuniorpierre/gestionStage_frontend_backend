server.port=9080
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}&sslmode=require&channelBinding=require
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.application.name=internship_Management
jwt.secret=${JWT_SECRET}

# Configuration Brevo API
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=teamkf48inscription@gmail.com
brevo.sender.name=Internship Platform

# Désactiver Spring Mail auto-configuration (nous utilisons l'API REST Brevo)
spring.mail.host=none
spring.mail.port=0
spring.mail.username=none
spring.mail.password=none

# Niveau de log
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.internship=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.internship.management=DEBUG

# Configuration pour le déploiement
server.servlet.context-path=/api
# cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ONLY these properties - no tomcat specific ones
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=10MB

# Afficher les erreurs dans la console
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:https://gestion-stage-frontend-backend.vercel.app}
